<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1422" />
    <meta name="description" content="Shakedown —— 真实测出 bug 的软件测试 Agent 平台" />
    <script>
      try {
        var theme = localStorage.getItem('shakedown-theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230e9384'/%3E%3Cpath d='M6 13c3 0 3 3.5 6 3.5s3-3.5 6-3.5 3 3.5 6 3.5M6 20c3 0 3 3.5 6 3.5s3-3.5 6-3.5 3 3.5 6 3.5' fill='none' stroke='%23042f2e' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Shakedown · 软件测试 Agent</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
